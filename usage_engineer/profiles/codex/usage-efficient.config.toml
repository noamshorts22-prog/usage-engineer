# Activate explicitly:   codex --profile usage-efficient
#
# What it does NOT change: model, model_reasoning_effort, context window, compaction,
# service tier, sandbox, approvals, memories, plugins, MCP servers. Nothing here
# overrides your base config except the extra developer instructions below.
