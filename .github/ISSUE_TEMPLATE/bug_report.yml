name: Bug report
description: Something in ue behaves wrongly
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: ue audit --json-out audit.json
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ue doctor`
      description: Paths are already redacted to %HOME%.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
